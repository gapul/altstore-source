name: update-source

# 各アプリの最新ビルドを見て source.json を書き換える。追随先の対応表は
# scripts/refresh_source.py にあり、アプリを増やすときもそこだけ触れば足りる。

on:
  # ビルド側リポ(keepassium-ios / blink-ios / jp-phone-opendata)がリリース後に叩く
  repository_dispatch:
    types: [refresh-source]
  # 手組み .ipa をこのリポにアップロードしたとき。トークンが要らないので確実
  release:
    types: [published]
  workflow_dispatch:
  # 上のどれも起きない上流(Mangayomi など)を拾う網
  schedule:
    - cron: '0 16 * * *'      # ビルド系(15:00/15:30 UTC)の後、JST 1時ごろ

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # release イベントで起動した回はタグの detached HEAD になり、最後の push が
      # 行き先を失う。書き戻す先は常に main。
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point source.json at the newest builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_source.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet source.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add source.json
            git commit -m "chore: refresh source.json from build repos"
            git push
          else
            echo "no changes to commit"
          fi
